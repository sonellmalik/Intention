name: Build Installers

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ''
          WIN_CSC_LINK: ''
        run: node build.js ${{ matrix.platform }}

      - name: Upload Windows installer
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: Intention-Windows-Installer
          # Include the auto-update metadata (latest.yml) and blockmap so
          # electron-updater can detect and download new versions.
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          retention-days: 30

      - name: Upload macOS DMG
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: Intention-macOS-DMG
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/latest-mac.yml
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          make_latest: true
          files: |
            artifacts/Intention-Windows-Installer/*.exe
            artifacts/Intention-Windows-Installer/*.exe.blockmap
            artifacts/Intention-Windows-Installer/latest.yml
            artifacts/Intention-macOS-DMG/*.dmg
            artifacts/Intention-macOS-DMG/*.dmg.blockmap
            artifacts/Intention-macOS-DMG/latest-mac.yml
