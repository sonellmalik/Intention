<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intention Timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            -webkit-app-region: drag;
            display: flex;
            align-items: flex-start; /* pin to top; unused height stays transparent */
            height: 100vh;
        }

        .mini-container {
            position: relative;
            width: 100%;
            background: rgba(20, 20, 35, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 14px;
            padding: 12px 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        /* Window buttons (resize + close) pinned to the top-right corner. They
           stay hidden until the user hovers over the mini window, keeping the
           overlay minimal. */
        .mini-window-buttons {
            position: absolute;
            top: 4px;
            right: 6px;
            display: flex;
            gap: 4px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease;
            -webkit-app-region: no-drag;
            z-index: 5;
        }

        .mini-container:hover .mini-window-buttons {
            opacity: 1;
            pointer-events: auto;
        }

        .mini-window-btn {
            width: 16px;
            height: 16px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
            color: rgba(255, 255, 255, 0.85);
            font-size: 10px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: background 0.15s;
        }

        .mini-window-btn:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        .mini-window-btn-close:hover {
            background: #f72585;
            color: #fff;
        }

        /* Top row: timer + controls always share one line so the Open App
           button stays visible no matter how long the task name is. */
        .mini-top-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .timer-time {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
            line-height: 1.1;
        }

        .timer-time.break-mode {
            color: #4cc9f0;
        }

        /* Task name lives on its own line below the timer/controls row. It may
           wrap onto a second line; beyond that it's clamped with an ellipsis and
           the full name is available via the hover tooltip (title attribute). */
        /* Task name and Refocus button share one line. The task name flexes to
           fill the space and truncates so the fixed-width button always fits
           without the window getting any wider. */
        .mini-task-row {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .timer-task {
            font-size: 0.68rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.25;
            flex: 1 1 auto;
            min-width: 0; /* allow the flex item to shrink and truncate */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            word-break: break-word;
            -webkit-app-region: no-drag; /* allow hovering to read the tooltip */
        }

        .timer-task.hidden {
            display: none;
        }

        .mini-controls {
            display: flex;
            gap: 6px;
            margin-left: auto; /* pin controls to the right, keep Open App visible */
            flex-shrink: 0;
            -webkit-app-region: no-drag;
        }

        .mini-btn {
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            color: white;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .mini-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .mini-btn.distraction-btn {
            background: rgba(247, 37, 133, 0.25);
            font-size: 10px;
            position: relative;
        }

        .mini-btn.distraction-btn:hover {
            background: rgba(247, 37, 133, 0.45);
        }

        .distraction-count {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #f72585;
            color: white;
            font-size: 9px;
            font-weight: 700;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .distraction-count.hidden {
            display: none;
        }

        /* Refocus button sits on the same line as the task name, compact and
           fixed-width so the task name truncates instead of widening the row. */
        .mini-refocus-btn {
            -webkit-app-region: no-drag;
            flex: 0 0 auto;
            white-space: nowrap;
            border: 1px solid rgba(76, 201, 240, 0.4);
            background: rgba(76, 201, 240, 0.15);
            color: #e8ecf5;
            font-size: 0.68rem;
            font-weight: 600;
            padding: 3px 12px;
            border-radius: 999px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .mini-refocus-btn:hover {
            background: rgba(76, 201, 240, 0.3);
        }

        .mode-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4361ee;
        }

        .mode-dot.break {
            background: #4cc9f0;
        }
    </style>
</head>
<body>
    <div class="mini-container">
        <div class="mini-window-buttons">
            <button class="mini-window-btn" id="btn-resize-mini" title="Open main window">&#10530;</button>
            <button class="mini-window-btn mini-window-btn-close" id="btn-close-mini" title="Close overlay (timer keeps running)">&times;</button>
        </div>
        <div class="mini-top-row">
            <div class="mode-dot" id="mode-dot"></div>
            <div class="timer-time" id="timer-time">25:00</div>
            <div class="mini-controls">
                <button class="mini-btn distraction-btn" id="btn-distraction" title="Log Distraction">
                    !
                    <span class="distraction-count hidden" id="distraction-count">0</span>
                </button>
                <button class="mini-btn" id="btn-pause" title="Pause/Resume">⏸</button>
                <button class="mini-btn" id="btn-yapsheet" title="Open Yap Sheet">&#128221;</button>
            </div>
        </div>
        <div class="mini-task-row">
            <div class="timer-task hidden" id="timer-task"></div>
            <button class="mini-refocus-btn" id="btn-refocus" title="Take a box-breathing break to refocus">&#127788; Refocus</button>
        </div>
    </div>

    <script>
        const timerTime = document.getElementById('timer-time');
        const timerTask = document.getElementById('timer-task');
        const modeDot = document.getElementById('mode-dot');
        const btnPause = document.getElementById('btn-pause');
        const btnYapSheet = document.getElementById('btn-yapsheet');
        const btnDistraction = document.getElementById('btn-distraction');
        const distractionCountEl = document.getElementById('distraction-count');
        const btnRefocus = document.getElementById('btn-refocus');
        const btnResizeMini = document.getElementById('btn-resize-mini');
        const btnCloseMini = document.getElementById('btn-close-mini');

        // Resize button opens the bigger (main) window.
        if (btnResizeMini) {
            btnResizeMini.addEventListener('click', (e) => {
                e.stopPropagation();
                if (window.electronAPI && window.electronAPI.showMainWindow) {
                    window.electronAPI.showMainWindow();
                }
            });
        }

        // Close button hides the overlay; the timer keeps running in the main
        // window. Reopen it from the ▼ button on the timer page.
        if (btnCloseMini) {
            btnCloseMini.addEventListener('click', (e) => {
                e.stopPropagation();
                if (window.electronAPI && window.electronAPI.closeMini) {
                    window.electronAPI.closeMini();
                }
            });
        }

        // Refocus opens the full-screen box-breathing overlay in the main window.
        if (btnRefocus) {
            btnRefocus.addEventListener('click', (e) => {
                e.stopPropagation();
                if (window.electronAPI && window.electronAPI.openRefocus) {
                    window.electronAPI.openRefocus();
                }
            });
        }

        // Yap Sheet button asks the main window to open the thoughts log.
        if (btnYapSheet) {
            btnYapSheet.addEventListener('click', (e) => {
                e.stopPropagation();
                if (window.electronAPI && window.electronAPI.openYapSheet) {
                    window.electronAPI.openYapSheet();
                }
            });
        }

        let isPaused = false;
        let localCount = 0;

        // Receive time updates from main window
        window.electronAPI.onUpdateTime((time) => {
            timerTime.textContent = time;
        });

        // Receive mode updates
        window.electronAPI.onUpdateMode((mode) => {
            if (mode === 'work') {
                modeDot.classList.remove('break');
                timerTime.classList.remove('break-mode');
            } else {
                modeDot.classList.add('break');
                timerTime.classList.add('break-mode');
            }
        });

        const miniContainer = document.querySelector('.mini-container');

        // Ask the main process to size the window to the container's content so
        // nothing is clipped (long task -> taller) and there's no empty space
        // (no task -> compact). Deferred to the next frame so layout has settled.
        function requestResize() {
            requestAnimationFrame(() => {
                // +4px breathing room below the rounded container
                const h = Math.ceil(miniContainer.getBoundingClientRect().height) + 4;
                if (window.electronAPI.resizeMiniWindow) {
                    window.electronAPI.resizeMiniWindow(h);
                }
            });
        }

        // Receive the current scheduler time-block title (shown under the timer)
        window.electronAPI.onUpdateTask((task) => {
            if (task && task.trim()) {
                timerTask.textContent = task;
                timerTask.title = task;
                timerTask.classList.remove('hidden');
            } else {
                timerTask.textContent = '';
                timerTask.classList.add('hidden');
            }
            requestResize();
        });

        // Receive distraction count sync
        window.electronAPI.onDistractionCountUpdate((count) => {
            localCount = count;
            updateCountBadge();
        });

        btnPause.addEventListener('click', (e) => {
            e.stopPropagation();
            isPaused = !isPaused;
            btnPause.textContent = isPaused ? '▶' : '⏸';
            window.electronAPI.miniPauseToggle();
        });

        btnDistraction.addEventListener('click', (e) => {
            e.stopPropagation();
            localCount++;
            updateCountBadge();
            window.electronAPI.logDistraction();
        });

        function updateCountBadge() {
            if (localCount > 0) {
                distractionCountEl.textContent = localCount;
                distractionCountEl.classList.remove('hidden');
            } else {
                distractionCountEl.classList.add('hidden');
            }
        }

        // Size the window to its initial (task-less) content on load.
        requestResize();
    </script>
</body>
</html>
